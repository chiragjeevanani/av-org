<h2 style="color: #0A2463; margin-top: 0; font-size: 18px; font-weight: 800;">⚡ New Website Inquiry Received</h2>
<p style="color: #475569; font-size: 14px; margin-bottom: 20px;">A new customer proposal request has been submitted via the contact form:</p>

<table style="width: 100%; border-collapse: collapse; font-size: 13px;">
  <tr style="border-bottom: 1px solid #f1f5f9;">
    <td style="padding: 10px 0; font-weight: bold; color: #475569; width: 140px;">Client Name:</td>
    <td style="padding: 10px 0; color: #0f172a; font-weight: 700;">{{name}}</td>
  </tr>
  <tr style="border-bottom: 1px solid #f1f5f9;">
    <td style="padding: 10px 0; font-weight: bold; color: #475569;">Phone Number:</td>
    <td style="padding: 10px 0; color: #0f172a;"><a href="tel:{{phone}}" style="color: #0A2463; text-decoration: none; font-weight: 700;">{{phone}}</a></td>
  </tr>
  <tr style="border-bottom: 1px solid #f1f5f9;">
    <td style="padding: 10px 0; font-weight: bold; color: #475569;">Email Address:</td>
    <td style="padding: 10px 0; color: #0f172a;"><a href="mailto:{{email}}" style="color: #2563eb; text-decoration: none;">{{email}}</a></td>
  </tr>
  <tr style="border-bottom: 1px solid #f1f5f9;">
    <td style="padding: 10px 0; font-weight: bold; color: #475569;">Project Interest:</td>
    <td style="padding: 10px 0; color: #D97706; font-weight: 800;">{{project}}</td>
  </tr>
  <tr>
    <td style="padding: 10px 0; font-weight: bold; color: #475569; vertical-align: top;">Requirements:</td>
    <td style="padding: 10px 0; color: #1e293b; white-space: pre-wrap;">{{message}}</td>
  </tr>
</table>

<div style="margin-top: 24px; text-align: center;">
  <a href="http://localhost:5173/admin/inquiries" style="display: inline-block; padding: 12px 24px; background: #0A2463; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 12px; border-radius: 8px; text-transform: uppercase; letter-spacing: 1px;">View Inquiry in Admin Panel →</a>
</div>
